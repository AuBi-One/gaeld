allowBuilds:
  '@sentry/cli': true
  esbuild: true

minimumReleaseAgeExclude:
  - brace-expansion@5.0.12
  - source-map-js@1.2.2

overrides:
  '@babel/core': ^7.29.6
  brace-expansion: ^5.0.12
  # Remove when Sentry requires glob >=14.0.2 (GHSA-3g3m-2fjr-6pw4).
  '@sentry/bundler-plugins>glob': 14.0.2

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (build-time, via vite): no fixed release yet (latest 4.0.7, 2026-11-17).
    # Remove once picomatch 4.0.8 is out and the lockfile has it.
    - GHSA-fc5q-39xc-vjpf
